name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
          cache: pip
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run studio:build
      - run: npm audit --audit-level=low
      - run: python -m pip install uv==0.13.5 pip-audit==2.10.1
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev python -m ruff check src/studio tests/studio
      - if: runner.os == 'Windows'
        run: uv run --frozen --extra dev python -m pytest tests -q
      - if: runner.os == 'Linux'
        run: uv run --frozen --extra dev python -m pytest tests/studio -q
      - run: uv pip check
      - run: uv export --frozen --all-extras --no-emit-project --format requirements-txt --output-file python-audit-requirements.txt
      - run: python -m pip_audit -r python-audit-requirements.txt --no-deps --disable-pip --strict -f json -o python-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-audit-${{ matrix.os }}
          path: python-audit.json
          if-no-files-found: warn
      - if: runner.os == 'Windows'
        run: uv sync --frozen --all-extras
      - if: runner.os == 'Windows'
        run: uv run --frozen --all-extras python -m PyInstaller --noconfirm --clean AI-Clean-Paste-Studio.spec
      - if: runner.os == 'Windows'
        run: uv run --frozen --all-extras python -m PyInstaller --noconfirm --clean AI-Clean-Paste-Companion.spec
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-standalone.ps1 | ConvertTo-Json | Set-Content standalone-verification.json
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-verification
          path: standalone-verification.json
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
      - run: docker build --tag cleanpaste:ci .
      - run: python scripts/check-container.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-verification
          path: artifacts/container-verification.json
          if-no-files-found: error
