name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run studio:build
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src/studio tests/studio
      - run: python -m pytest tests/studio -q
