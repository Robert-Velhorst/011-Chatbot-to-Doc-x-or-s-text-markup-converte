[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ai-clean-paste-studio"
version = "0.2.0"
description = "Local-first chatbot and markup to verified document converter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apsw==3.54.1.0",
  "fastapi==0.161.1",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "python-docx==1.2.0",
  "reportlab==5.1.0",
  "markdown-it-py==4.2.0",
  "pillow==13.0.0",
  "pypdf==6.21.2",
  "pywin32==312; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.2",
]
standalone = [
  "pyinstaller==6.22.3",
  "pystray==0.19.5",
]

[project.scripts]
clean-paste-studio = "cleanpaste_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/studio/cleanpaste_studio"]

[tool.pytest.ini_options]
testpaths = ["tests/studio"]
pythonpath = ["src/windows"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
