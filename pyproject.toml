[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-clean-paste-studio"
version = "0.2.0"
description = "Local-first chatbot and markup to verified document converter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "pydantic>=2.11,<3",
  "python-docx>=1.2,<2",
  "reportlab>=4.4,<5",
  "markdown-it-py>=3.0,<5",
  "pillow>=11,<13",
  "pypdf>=5.8,<7",
  "pywin32>=311; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]
standalone = [
  "pyinstaller>=6.14,<7",
  "pystray>=0.19.5,<1",
]

[project.scripts]
clean-paste-studio = "cleanpaste_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/studio/cleanpaste_studio"]

[tool.pytest.ini_options]
testpaths = ["tests/studio"]
pythonpath = ["src/windows"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
